; PHP settings for hosts running PHP as CGI/FastCGI, where the php_value lines
; in .htaccess are ignored. Most shared hosts (Hostinger included) are in this
; category, so this file is the one that actually takes effect there.
;
; /upload-document accepts files up to 10 MB. The stock limits are 2 MB
; (upload_max_filesize) and 8 MB (post_max_size), which would reject an 8 MB
; affidavit before any of the application's own validation ran. The headroom on
; post_max_size covers the multipart encoding and the other fields.

upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 120
max_input_time = 120

; Errors are logged, never printed: a PHP notice in the middle of a page is both
; an ugly break in the design and an information leak. bootstrap.php sets these
; too, for hosts that ignore this file.
display_errors = Off
log_errors = On

; Hides "PHP/8.x.y" from the Server response header.
expose_php = Off
